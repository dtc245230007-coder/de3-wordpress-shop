# =============================================================================
# Nginx reverse proxy – Đề 3 Website Quảng bá Sản phẩm (WordPress)
# Mount vào /etc/nginx/conf.d/default.conf (chỉ đọc)
# File này nằm trong khối http {} của nginx.conf nên được phép khai báo
# limit_req_zone / map ở cấp http.
# =============================================================================

# Không lộ phiên bản Nginx trong header Server và trang lỗi
server_tokens off;

# Hỗ trợ WebSocket / HTTP Upgrade khi chuyển tiếp
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Giới hạn tần suất -------------------------------------------------------
# wp_login : 10 request/phút cho mỗi IP – chống dò mật khẩu wp-admin
# wp_site  : 30 request/giây cho mỗi IP – chống lạm dụng chung
limit_req_zone  $binary_remote_addr zone=wp_login:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=wp_site:10m  rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

# =============================================================================
# CỔNG 8080 – HTTP, chỉ để chuyển hướng sang HTTPS
# =============================================================================
server {
    listen      8080;
    server_name _;

    # Dùng cho healthcheck của Docker (không bị 301)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# =============================================================================
# CỔNG 8090 – chỉ phục vụ stub_status cho nginx-prometheus-exporter
# Cổng này KHÔNG được publish ra ngoài, chỉ container trong mạng Docker gọi được
# =============================================================================
server {
    listen      8090;
    server_name _;
    access_log  off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    location / {
        return 404;
    }
}

# =============================================================================
# CỔNG 8443 – HTTPS (TLS 1.2/1.3) – điểm vào chính của website
# =============================================================================
server {
    listen              8443 ssl;
    http2               on;
    server_name         _;

    # Gõ nhầm http:// vào đúng cổng HTTPS thì nginx trả 400 (mã nội bộ 497).
    # Chuyển hướng sang HTTPS thay vì bắt người dùng nhìn trang lỗi.
    error_page 497 =301 https://$host:$server_port$request_uri;

    # Phân giải lại tên container mỗi 10 giây: khi container wordpress được
    # tạo lại (đổi IP) Nginx vẫn tìm đúng địa chỉ mới, tránh lỗi 502.
    resolver            127.0.0.11 valid=10s ipv6=off;
    set $wp_backend     http://wordpress:80;

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers (OWASP Secure Headers Project) ---------------------
    # X-Frame-Options dùng SAMEORIGIN thay vì DENY: WordPress dùng iframe
    # cùng origin cho phần tuỳ biến giao diện, DENY sẽ làm hỏng chức năng này.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 64m;      # cho phép tải ảnh sản phẩm lên
    client_body_timeout  60s;
    keepalive_timeout    65s;

    # Không để lộ thông tin phần mềm phía sau
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Chặn truy cập tệp ẩn (.git, .env, .htaccess ...), vẫn cho .well-known
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
    }

    # xmlrpc.php thường bị lợi dụng để dò mật khẩu hàng loạt
    location = /xmlrpc.php {
        deny all;
        access_log off;
    }

    # Tệp tĩnh: cho trình duyệt đệm 30 ngày
    # Đặt TRƯỚC khối wp-login để CSS/JS của trang đăng nhập không bị tính
    # vào hạn mức rate limit (Nginx xét các location regex theo thứ tự khai báo).
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|ttf|eot)$ {
        expires    30d;
        access_log off;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass $wp_backend;
    }

    # Trang đăng nhập quản trị: 10 request/phút/IP, bùng nổ tối đa 5.
    # Chỉ áp cho wp-login.php; nếu áp cả /wp-admin/ thì admin-ajax.php
    # (trình soạn thảo gọi liên tục) sẽ bị 429 và làm hỏng giao diện quản trị.
    location = /wp-login.php {
        limit_req  zone=wp_login burst=5 nodelay;
        limit_conn perip 10;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass $wp_backend;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req  zone=wp_site burst=60 nodelay;
        limit_conn perip 20;
        include    /etc/nginx/snippets/proxy.conf;
        proxy_pass $wp_backend;
    }
}
