# Header chuyển tiếp chuẩn cho reverse proxy
proxy_http_version 1.1;

# Dùng $http_host (kèm cổng) thay vì $host: WordPress dựng URL tuyệt đối từ
# HTTP_HOST, nếu mất ":8443" thì mọi link trong wp-admin sẽ trỏ sai cổng 443.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Port  $server_port;

# Apache phía sau không biết mình đang chạy sau TLS: khi chuẩn hoá thư mục
# (/wp-admin -> /wp-admin/) nó trả Location: http://host:8443/... dù trình
# duyệt đang gọi HTTPS. Trình duyệt đi theo địa chỉ http đó tới đúng cổng TLS
# và nhận 400 "The plain HTTP request was sent to HTTPS port".
# Viết lại Location http://$http_host/ thành https://$http_host/.
proxy_redirect http://$http_host/ https://$http_host/;

# WebSocket
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Thời gian chờ
proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Không lộ thông tin máy chủ phía sau
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
